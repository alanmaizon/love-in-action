# Render Blueprint - Infrastructure as Code
# Deploy with: Connect GitHub repo to Render

services:
  # Django Backend
  - type: web
    name: lia-api
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
      python manage.py migrate
    startCommand: gunicorn love_backend.wsgi:application
    envVars:
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: ".onrender.com,.loveinaction.com"
      - key: DATABASE_URL
        fromDatabase:
          name: lia-db
          property: connectionString
      - key: FRONTEND_URL
        value: "https://loveinaction.onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://loveinaction.onrender.com,https://loveinaction.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://loveinaction.onrender.com,https://loveinaction.com"
      - key: STRIPE_SECRET_KEY
        sync: false  # Set manually in dashboard
      - key: STRIPE_WEBHOOK_SECRET
        sync: false  # Set manually in dashboard
      - key: PYTHON_VERSION
        value: "3.12.0"

  # React Frontend
  - type: web
    name: lia-frontend
    runtime: static
    buildCommand: cd ../love_frontend && npm install && npm run build
    staticPublishPath: ../love_frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: lia-db
    plan: free
    databaseName: lia
    user: lia_user
