services:
  backend:
    build: ./love_backend
    ports:
      - "8000:8000"
    env_file:
      - ./love_backend/.env
    environment:
      - DATABASE_URL=postgres://lia_user:${DB_PASSWORD:-changeme}@db:5432/lia_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./love_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: lia_db
      POSTGRES_USER: lia_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lia_user -d lia_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
